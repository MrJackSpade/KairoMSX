name: Google Play release

# tag-builds.yml dispatches this after it publishes a release tag (not prereleases), and it can be
# run by hand to publish an existing release's Play bundle.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose Play bundle to publish'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: MrJackSpade/Kairo/.github/workflows/app-play-release.yml@ecd78100896636318f1d20b0cefc694a57195b75
    with:
      name: KairoMSX
      package: com.loxifi.kairomsx
      tag: ${{ inputs.tag }}
